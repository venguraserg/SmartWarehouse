name: Android

# Сборка приложения для Android (оболочка веб-приложения склада).
# Готовый APK — в «Artifacts» сборки, а для main — ещё и в релизе «android-latest».
on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка APK
        run: gradle assembleRelease --no-daemon

      - name: Имя файла
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SmartWarehouse-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartWarehouse-android
          path: mobile/android/out/*.apk

      - name: Релиз android-latest (только main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Приложение для Android" --notes "Последняя сборка приложения «Склад» для Android. Скачайте APK и установите на телефон или ТСД." --latest=false
          gh release upload android-latest out/*.apk --clobber
          # Оставляем в релизе только последний APK.
          for f in $(gh release view android-latest --json assets --jq '.assets[].name'); do
            [ "$f" = "SmartWarehouse-1.0.${GITHUB_RUN_NUMBER}.apk" ] || gh release delete-asset android-latest "$f" -y
          done
