name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Восстановление пакетов
        run: dotnet restore SmartWarehouse.slnx

      - name: Сборка
        run: dotnet build SmartWarehouse.slnx --no-restore -c Release

      - name: Тесты
        run: dotnet test SmartWarehouse.slnx --no-build -c Release --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t smartwarehouse-api .
