name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Восстановление пакетов
        run: dotnet restore SmartWarehouse.slnx

      - name: Сборка
        run: dotnet build SmartWarehouse.slnx --no-restore -c Release

      - name: Тесты
        run: dotnet test SmartWarehouse.slnx --no-build -c Release --logger "console;verbosity=normal" --logger GitHubActions

  # Скрипты сервера (deploy/windows/*.ps1) запускаются только на Windows-сервере — проверяем хотя бы синтаксис.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис PowerShell-скриптов
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem deploy -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Синтаксис скриптов в порядке."

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа API
        run: docker build -t smartwarehouse-api .
      - name: Сборка образа веб-интерфейса
        run: docker build -f Dockerfile.web -t smartwarehouse-web .
