name: migration

on:
  push:
    branches: [feature/invoice-import]

permissions:
  contents: write

jobs:
  migration:
    if: contains(github.event.head_commit.message, '[gen-migration]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Восстановление и сборка
        run: |
          dotnet restore SmartWarehouse.slnx
          dotnet build SmartWarehouse.slnx --no-restore
      - name: dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Миграция
        run: dotnet ef migrations add AddReceiving -p SmartWarehouse.Infrastructure -s SmartWarehouse.API -o Data/Migrations --no-build
      - name: Коммит
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add SmartWarehouse.Infrastructure/Data/Migrations
          git commit -m "Миграция AddReceiving (сгенерирована в CI)"
          git push
